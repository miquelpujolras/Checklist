<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RI-01 Revisió Split A.C.</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#14212b;--mut:#5b6b78;--line:#cfd8df;--pri:#0b2d50;--ok:#1b7f3b;--no:#c0392b;--na:#6b7780}
*{box-sizing:border-box}
body{margin:0;font:17px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px}
header small{opacity:.85}
main{padding:12px;max-width:720px;margin:auto}
section{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:14px;padding:12px}
h2{font-size:15px;margin:-12px -12px 10px;padding:9px 12px;background:var(--pri);color:#fff;border-radius:5px 5px 0 0;letter-spacing:.03em}
label{display:block;font-size:14px;color:var(--mut);margin-top:8px}
input[type=text],input[type=email],input[type=number],textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)}
input[readonly]{background:#eef2f5}
.pt{border-top:1px solid var(--line);padding:12px 0}
.pt:first-of-type{border-top:0}
.pt>b{display:block;margin-bottom:8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:48px;font:inherit;font-weight:600;border:2px solid var(--line);background:#fff;border-radius:4px;color:var(--mut)}
.seg button.on[data-r=ok]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on[data-r=nok]{background:var(--no);border-color:var(--no);color:#fff}
.seg button.on[data-r=na]{background:var(--na);border-color:var(--na);color:#fff}
.seg.neu button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.row{display:flex;gap:8px;align-items:center;margin-top:6px}
.row input{flex:1}
.row span{min-width:34px;color:var(--mut)}
.sub{font-size:14px;color:var(--mut);margin-top:10px}
.photo{position:relative;display:inline-block;min-height:48px;padding:12px 14px;border:2px dashed var(--pri);border-radius:4px;color:var(--pri);font-weight:600;margin:8px 8px 0 0}
.photo.has{border-style:solid;background:#e6eef6}
.thumb{display:block;max-width:180px;margin-top:8px;border-radius:4px}
.thumb[hidden]{display:none}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
canvas{width:100%;height:130px;border:1px solid var(--line);border-radius:4px;background:#fff;touch-action:none}
.btn{width:100%;min-height:52px;font:inherit;font-weight:700;border:0;border-radius:4px;background:var(--pri);color:#fff;margin-top:10px}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.mini{min-height:40px;margin-top:6px}
#msg{margin:10px 0;font-weight:600}
.err{color:var(--no)}.good{color:var(--ok)}
:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
</style>
</head>
<body>
<header><h1>RI-01 Revisió Split A.C.</h1><small>Termotur · Divisió manteniment preventiu · <span id="dat"></span></small></header>
<main>
<section>
<h2>DADES DEL SERVEI</h2>
<label>Projecte<input type="text" id="prj"></label>
<label>Direcció<input type="text" id="dir"></label>
<label>Servei<input type="text" value="AIRE CONDICIONAT" readonly></label>
<label>Operari responsable de la intervenció<input type="text" id="ope"></label>
<label>Email del client (opcional)<input type="email" id="mail"></label>
</section>

<section>
<h2>APARELL D'AIRE CONDICIONAT</h2>
<label>Marca<input type="text" id="mar"></label>
<label>Model<input type="text" id="mod"></label>
<label>Nº d'aparell<input type="text" id="num"></label>
<label>Planta / zona<input type="text" id="zona"></label>
<label>Ubicació (sala, espai...)<input type="text" id="ubi"></label>
<label>Gas refrigerant<input type="text" id="gas"></label>
</section>

<div id="fa"></div>
<section id="ops"><h2>OPERACIONS A REALITZAR</h2></section>
<div id="fd"></div>

<section>
<h2>8 · OBSERVACIÓ GENERAL</h2>
<textarea id="obg" rows="3"></textarea>
</section>
<section>
<h2>9 · OBSERVACIONS PERSONAL SERVEI TÈCNIC</h2>
<textarea id="obt" rows="3"></textarea>
</section>

<section>
<h2>SIGNATURES</h2>
<div class="sub">Tècnic (Marc Xavier Tur Doherty)</div>
<canvas id="f1"></canvas><button class="btn sec mini" data-c="1">Esborrar</button>
<div class="sub">Operari responsable de la intervenció</div>
<canvas id="f2"></canvas><button class="btn sec mini" data-c="2">Esborrar</button>
</section>

<div id="msg"></div>
<button class="btn" id="enviar">Enviar a l'oficina</button>
<button class="btn sec" id="bajar">Descarregar PDF de prova</button>
</main>

// ===== Fotos =====
function comprimir(file){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{try{
      const k=Math.min(1,1024/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.6));
    }catch(e){rej(e)}};
    img.onerror=()=>rej(new Error("format no compatible o foto massa gran"));
    img.src=u;
  });
}
function bloqueFoto(id,titulo){
  const s=document.createElement("section");
  s.innerHTML=`<h2>${titulo}</h2>
   <label class="photo">Fer foto<input type="file" accept="image/*" capture="environment"></label>
   <label class="photo">Triar arxiu<input type="file" accept="image/*"></label>
   <img class="thumb" hidden>`;
  s.querySelectorAll("input").forEach(inp=>inp.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      R[id]=await comprimir(f);
      const im=s.querySelector(".thumb");im.src=R[id];im.hidden=false;
      s.querySelectorAll(".photo").forEach(p=>p.classList.add("has"));msg("");
    }catch(err){msg("No s'ha pogut processar la foto: "+err.message,"err")}
    e.target.value="";
  });
  $("#"+id).appendChild(s);
}

bloqueFoto("fd","FOTO DESPRÉS DE LA INTERVENCIÓ");

OPS.forEach(o=>{
  const a=R.ops[o.n]={r:"",c:{}};

  d.innerHTML=`<b>${o.n}. ${o.t}</b>
   <div class="seg"><button data-r="ok">OK</button><button data-r="nok">No OK</button><button data-r="na">N/A</button></div>`;

// ===== Signatures =====
function mkFirma(id){
  const cv=document.getElementById(id),cx=cv.getContext("2d");let dib=false,ok=false;
  cv.width=cv.offsetWidth;cv.height=cv.offsetHeight;cx.lineWidth=2.5;cx.lineCap="round";cx.strokeStyle="#14212b";
  const p=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{dib=true;ok=true;cx.beginPath();cx.moveTo(...p(e))};
  cv.onpointermove=e=>{if(dib){cx.lineTo(...p(e));cx.stroke()}};
  cv.onpointerup=cv.onpointerleave=()=>dib=false;
  return{ok:()=>ok,img:()=>cv.toDataURL("image/png"),clear:()=>{cx.clearRect(0,0,cv.width,cv.height);ok=false}};
}
const F={1:mkFirma("f1"),2:mkFirma("f2")};
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>F[b.dataset.c].clear());

// ===== PDF =====
function crearPDF(){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210,M=12,IW=W-2*M;let y=M;
  const salto=h=>{if(y+h>287){doc.addPage();y=M}};
  const barra=t=>{salto(12);doc.setFillColor(11,45,80);doc.rect(M,y,IW,6.5,"F");doc.setTextColor(255);
    doc.setFont("helvetica","bold");doc.setFontSize(10);doc.text(t,W/2,y+4.5,{align:"center"});doc.setTextColor(0);y+=9.5};
  const fila=(a,b)=>{salto(6);doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.text(a,M,y);
    doc.setFont("helvetica","normal");doc.text(String(b||"-"),M+36,y,{maxWidth:IW-36});y+=5.5};

  doc.addImage(LOGO,"JPEG",M,y,24,24);const tx=M+28;
  doc.setFont("helvetica","bold");doc.setFontSize(22);doc.setTextColor(11,45,80);doc.text("TERMOTUR",tx,y+8);
  doc.setTextColor(0);doc.setFontSize(8);doc.setFont("helvetica","normal");
  doc.text("Aire condicionat · Calefacció · Gas · Tractament d'aigües",tx,y+13);
  doc.text("Avda. Rierany dels Frares, 7-8, 08397 Pineda de Mar · Tel. 93 769 02 49 · termotur@termotur.com",tx,y+17.5);
  doc.setFontSize(9);doc.text("Data manteniment: "+fechaHoy,W-M,y+8,{align:"right"});y+=28;
  barra("DIVISIÓ MANTENIMENT PREVENTIU");
  doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("RI-01 REVISIÓ SPLIT A.C.",M,y);
  doc.setFontSize(8);doc.setFont("helvetica","normal");doc.text("RE-09-03 · Edició 1",W-M,y,{align:"right"});y+=6;
  fila("PROJECTE",g("prj"));fila("DIRECCIÓ",g("dir"));fila("SERVEI","AIRE CONDICIONAT");fila("OPERARI",g("ope"));y+=2;

  barra("APARELL D'AIRE CONDICIONAT");
  fila("MARCA",g("mar"));fila("MODEL",g("mod"));fila("Nº",g("num"));fila("PLANTA / ZONA",g("zona"));
  fila("UBICACIÓ",g("ubi"));fila("GAS REFRIGERANT",g("gas"));y+=2;

  barra("OPERACIONS A REALITZAR");
  OPS.forEach(o=>{
    const a=R.ops[o.n],tl=doc.splitTextToSize(o.n+".  "+o.t,IW-30);
    const vals=o.c.map(c=>`${c.x}: ${a.c[c.k]||"-"}${c.u&&a.c[c.k]?" "+c.u:""}`).join("   |   ");
    const vl=doc.splitTextToSize(vals,IW-6);
    salto(tl.length*4.5+vl.length*4.2+6);
    doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.text(tl,M,y);
    const txt={ok:"OK",nok:"NO OK",na:"N/A","":"-"}[a.r];
    if(a.r==="nok")doc.setTextColor(192,57,43);else if(a.r==="ok")doc.setTextColor(27,127,59);
    doc.text(txt,W-M,y,{align:"right"});doc.setTextColor(0);y+=tl.length*4.5;
    doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(70);doc.text(vl,M+4,y);doc.setTextColor(0);
    y+=vl.length*4.2+1.5;doc.setDrawColor(207,216,223);doc.line(M,y,W-M,y);y+=3.5;
  });
  y+=2;

  [["8. OBSERVACIÓ GENERAL",g("obg")],["9. OBSERVACIONS PERSONAL SERVEI TÈCNIC",g("obt")]].forEach(([t,v])=>{
    barra(t);const l=doc.splitTextToSize(v||"-",IW);salto(l.length*4.5+4);
    doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.text(l,M,y);y+=l.length*4.5+4;
  });

  // Fotos abans / després, una al costat de l'altra
  const w=(IW-6)/2,fs=[["ABANS DE LA INTERVENCIÓ",R.fa],["DESPRÉS DE LA INTERVENCIÓ",R.fd]];
  const hs=fs.map(([,f])=>{if(!f)return 0;const p=doc.getImageProperties(f);return w*p.height/p.width});
  if(R.fa||R.fd){
    doc.addPage();y=M;barra("ESTAT DE L'APARELL");
    fs.forEach(([t,f],i)=>{const x=M+i*(w+6);doc.setFont("helvetica","bold");doc.setFontSize(9);doc.text(t,x,y);
      if(f)doc.addImage(f,"JPEG",x,y+2,w,hs[i]);});
    y+=Math.max(...hs)+10;
  }

  salto(62);barra("SIGNATURA DEL TÈCNIC, EMPRESA INSTAL·LADORA I OPERARI RESPONSABLE INTERVENCIÓ");
  doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.text("PINEDA DE MAR, a "+fechaHoy,M,y);y+=6;
  const bw=IW/2-2;
  [[M,"TÈCNIC","Marc Xavier Tur Doherty\nEnginyer Tècnic Industrial\nCol·legiat núm. 17.234\nCETIG",F[1]],
   [M+IW/2+2,"OPERARI RESP. INTERVENCIÓ",g("ope"),F[2]]].forEach(([x,t,n,f])=>{
    doc.setDrawColor(0);doc.rect(x,y,bw,40);doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.text(t,x+2,y+4.5);
    doc.setFont("helvetica","normal");doc.text(n,x+2,y+9,{maxWidth:bw*0.45});
    if(f.ok())doc.addImage(f.img(),"PNG",x+bw*0.48,y+8,bw*0.5,28);
  });
  return doc;
}

// ===== Validació i enviament =====
function validar(){
  const f=[];
  if(!g("prj"))f.push("projecte");
  if(!g("ope"))f.push("operari");
  return f;
}
$("#bajar").onclick=()=>{crearPDF().save("revisio-prova.pdf")};
$("#enviar").onclick=async()=>{
  const f=validar();
  if(f.length){msg("Falta: "+f.join(", "),"err");return}
  if(!SCRIPT_URL){msg("Falta configurar SCRIPT_URL al codi.","err");return}
  msg("Enviant…");$("#enviar").disabled=true;
  try{
    const pdf=crearPDF().output("datauristring").split(",")[1];
    const r=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      cliente:g("prj"),equipo:[g("mar"),g("mod"),g("ubi")].filter(Boolean).join(" · "),operario:g("ope"),
      emailCliente:g("mail"),fecha:new Date().toISOString(),pdf})});
    const j=await r.json();
    if(j.ok)msg("Enviat correctament.","good");else throw new Error(j.error);
  }catch(e){msg("No s'ha pogut enviar: "+e.message+". Torna-ho a provar amb cobertura.","err")}
  $("#enviar").disabled=false;
};
