<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión caldera de gas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#14212b;--mut:#5b6b78;--line:#cfd8df;--pri:#0b4f6c;--ok:#1b7f3b;--no:#c0392b;--na:#6b7780}
*{box-sizing:border-box}
body{margin:0;font:17px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px}
header small{opacity:.85}
main{padding:12px;max-width:720px;margin:auto}
section{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:14px;padding:12px}
h2{font-size:18px;margin:0 0 10px;color:var(--pri)}
label{display:block;font-size:14px;color:var(--mut);margin-top:8px}
input[type=text],input[type=email],input[type=number],textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:4px;background:#fff}
.pt{border-top:1px solid var(--line);padding:12px 0}
.pt:first-of-type{border-top:0}
.pt b{display:block;margin-bottom:8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:48px;font:inherit;font-weight:600;border:2px solid var(--line);background:#fff;border-radius:4px;color:var(--mut)}
.seg button.on[data-r=ok]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on[data-r=nok]{background:var(--no);border-color:var(--no);color:#fff}
.seg button.on[data-r=na]{background:var(--na);border-color:var(--na);color:#fff}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row input{flex:1}
.photo{display:inline-block;min-height:48px;padding:12px 14px;border:2px dashed var(--pri);border-radius:4px;color:var(--pri);font-weight:600;margin-top:8px}
.photo.req{border-color:var(--no);color:var(--no)}
.photo.has{border-style:solid;background:#e6f1f6;color:var(--pri)}
.thumb{display:block;max-width:140px;margin-top:8px;border-radius:4px}
canvas{width:100%;height:150px;border:1px solid var(--line);border-radius:4px;background:#fff;touch-action:none}
.btn{width:100%;min-height:52px;font:inherit;font-weight:700;border:0;border-radius:4px;background:var(--pri);color:#fff;margin-top:10px}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
#msg{margin:10px 0;font-weight:600}
.err{color:var(--no)}.good{color:var(--ok)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.photo{position:relative;margin-right:8px}
.thumb[hidden]{display:none}
:focus-visible{outline:3px solid #f5a623;outline-offset:2px}
</style>
</head>
<body>
<header><h1>Revisión caldera de gas</h1><small id="sub"></small></header>
<main>
<section id="datos">
<h2>Instalación</h2>
<label>Establecimiento<input type="text" id="cli"></label>
<label>Dirección<input type="text" id="dir"></label>
<label>Equipo (marca / modelo / nº serie)<input type="text" id="eq"></label>
<label>Ubicación del equipo<input type="text" id="ubi"></label>
<label>Operario<input type="text" id="ope"></label>
<label>Email del cliente (opcional)<input type="email" id="mail"></label>
</section>
<div id="lista"></div>
<section>
<h2>Observaciones generales</h2>
<textarea id="obsg" rows="3"></textarea>
</section>
<section>
<h2>Firma del cliente</h2>
<canvas id="firma"></canvas>
<button class="btn sec" id="borrar">Borrar firma</button>
</section>
<div id="msg"></div>
<button class="btn" id="enviar">Enviar a la oficina</button>
<button class="btn sec" id="bajar">Descargar PDF de prueba</button>
</main>

<script>
// ===== CONFIGURACIÓN =====
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz7yq0HsXJLn-cSS0xyxY0MpNDMjoXpuH3TCDXMbciWg6Xy5acqCTdDMRiNImzcCLtRYg/exec"; // URL de la web app de Apps Script (ver Code.gs)

// ===== CHECKLIST (editable: añade o quita puntos aquí) =====
// tipo: "ok" = OK/No OK/N/A | "med" = además valor medido | foto: "obl" obligatoria, "opc" opcional
const CHECK = [
 {t:"Seguridad y gas",p:[
  {id:"fugas",x:"Estanqueidad circuito de gas",f:"obl"},
  {id:"vent",x:"Ventilación del local",f:"opc"},
  {id:"detector",x:"Detector de gas / CO operativo",f:"opc"},
  {id:"valv",x:"Válvula de corte accesible",f:"opc"}]},
 {t:"Combustión",p:[
  {id:"co",x:"CO en humos",m:"ppm",f:"obl"},
  {id:"co2",x:"CO2 en humos",m:"%",f:"opc"},
  {id:"tghumos",x:"Temperatura de humos",m:"°C",f:"opc"},
  {id:"tiro",x:"Tiro y evacuación de humos",f:"opc"},
  {id:"quem",x:"Estado del quemador",f:"obl"}]},
 {t:"Hidráulica",p:[
  {id:"pres",x:"Presión del circuito",m:"bar",f:"obl"},
  {id:"vexp",x:"Vaso de expansión",f:"opc"},
  {id:"tida",x:"Temperatura de ida",m:"°C",f:"opc"},
  {id:"bomba",x:"Bomba circuladora",f:"opc"},
  {id:"fugasagua",x:"Fugas de agua",f:"opc"}]},
 {t:"Seguridades y limpieza",p:[
  {id:"termo",x:"Termostato de seguridad",f:"opc"},
  {id:"valvseg",x:"Válvula de seguridad",f:"opc"},
  {id:"limp",x:"Limpieza de intercambiador",f:"obl"},
  {id:"gen",x:"Estado general de la caldera",f:"obl"}]}
];

const R = {}; // respuestas
const $ = s => document.querySelector(s);
$("#sub").textContent = new Date().toLocaleDateString("es-ES");

// ===== Dibujar formulario =====
const lista = $("#lista");
CHECK.forEach(sec=>{
  const s = document.createElement("section");
  s.innerHTML = `<h2>${sec.t}</h2>`;
  sec.p.forEach(pt=>{
    R[pt.id] = {r:"",v:"",o:"",f:""};
    const d = document.createElement("div"); d.className="pt";
    d.innerHTML = `<b>${pt.x}</b>
     <div class="seg">
      <button data-r="ok">OK</button><button data-r="nok">No OK</button><button data-r="na">N/A</button>
     </div>
     ${pt.m?`<div class="row"><input type="number" inputmode="decimal" placeholder="Valor medido"><span>${pt.m}</span></div>`:""}
     <div class="row"><input type="text" placeholder="Observación"></div>
     <label class="photo">Hacer foto
       <input type="file" accept="image/*" capture="environment"></label>
     <label class="photo">Elegir archivo
       <input type="file" accept="image/*"></label>
     <img class="thumb" hidden>`;
    d.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
      R[pt.id].r=b.dataset.r;
      d.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b));
    });
    const ins = d.querySelectorAll(".row input");
    if(pt.m) ins[0].oninput=e=>R[pt.id].v=e.target.value;
    ins[ins.length-1].oninput=e=>R[pt.id].o=e.target.value;
    d.querySelectorAll("input[type=file]").forEach(inp=>inp.onchange=async e=>{
      const f=e.target.files[0]; if(!f) return;
      try{
        R[pt.id].f = await comprimir(f);
        const im=d.querySelector(".thumb"); im.src=R[pt.id].f; im.hidden=false;
        d.querySelectorAll(".photo").forEach(p=>p.classList.add("has"));
        msg("");
      }catch(err){msg("No se pudo procesar la foto de «"+pt.x+"»: "+err.message,"err")}
      e.target.value="";
    });
    s.appendChild(d);
  });
  lista.appendChild(s);
});

// ===== Foto: reducir a 1024 px JPEG =====
function comprimir(file){
  return new Promise((res,rej)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const k=Math.min(1,1024/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",.6));
      }catch(e){rej(e)}
    };
    img.onerror=()=>rej(new Error("formato no compatible o foto demasiado grande"));
    img.src=u;
  });
}

// ===== Firma =====
const cv=$("#firma"), cx=cv.getContext("2d"); let dib=false, firmado=false;
function ajusta(){cv.width=cv.offsetWidth;cv.height=cv.offsetHeight;cx.lineWidth=2.5;cx.lineCap="round";cx.strokeStyle="#14212b"}
ajusta();
const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.onpointerdown=e=>{dib=true;firmado=true;cx.beginPath();cx.moveTo(...pos(e))};
cv.onpointermove=e=>{if(dib){cx.lineTo(...pos(e));cx.stroke()}};
cv.onpointerup=cv.onpointerleave=()=>dib=false;
$("#borrar").onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);firmado=false};

// ===== PDF =====
function crearPDF(){
  const {jsPDF}=window.jspdf, doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210,M=14; let y=M;
  const salto=h=>{if(y+h>285){doc.addPage();y=M}};
  doc.setFontSize(16);doc.setFont("helvetica","bold");
  doc.text("Revisión de caldera de gas",M,y);y+=7;
  doc.setFontSize(10);doc.setFont("helvetica","normal");
  [["Establecimiento",$("#cli").value],["Dirección",$("#dir").value],["Equipo",$("#eq").value],
   ["Ubicación",$("#ubi").value],["Operario",$("#ope").value],["Fecha",new Date().toLocaleString("es-ES")]]
   .forEach(([a,b])=>{doc.text(`${a}: ${b}`,M,y);y+=5});
  y+=3;
  const nok=[];
  CHECK.forEach(sec=>{
    salto(14);doc.setFont("helvetica","bold");doc.setFontSize(12);
    doc.setFillColor(11,79,108);doc.setTextColor(255);doc.rect(M,y-4.5,W-2*M,7,"F");
    doc.text(sec.t,M+2,y);doc.setTextColor(0);y+=8;
    sec.p.forEach(pt=>{
      const a=R[pt.id]; salto(12);
      const txt={ok:"OK",nok:"NO OK",na:"N/A","":"sin revisar"}[a.r];
      doc.setFontSize(10);doc.setFont("helvetica","normal");doc.text(pt.x,M,y);
      doc.setFont("helvetica","bold");
      if(a.r==="nok"){doc.setTextColor(192,57,43);nok.push(pt.x)}
      else if(a.r==="ok")doc.setTextColor(27,127,59);
      doc.text(txt+(a.v?`  ${a.v} ${pt.m}`:""),W-M,y,{align:"right"});
      doc.setTextColor(0);doc.setFont("helvetica","normal");y+=5;
      if(a.o){const l=doc.splitTextToSize("Obs: "+a.o,W-2*M);salto(l.length*5);doc.text(l,M,y);y+=l.length*5}
      if(a.f){const p=doc.getImageProperties(a.f),w=70,h=w*p.height/p.width;
        salto(h+3);doc.addImage(a.f,"JPEG",M,y,w,h);y+=h+3}
      y+=2;
    });
  });
  salto(30);doc.setFont("helvetica","bold");doc.setFontSize(11);
  doc.text(nok.length?`Incidencias (${nok.length}): ${nok.join("; ")}`:"Sin incidencias",M,y,{maxWidth:W-2*M});y+=10;
  if($("#obsg").value){doc.setFont("helvetica","normal");const l=doc.splitTextToSize("Observaciones: "+$("#obsg").value,W-2*M);doc.text(l,M,y);y+=l.length*5+3}
  if(firmado){salto(35);doc.text("Firma del cliente:",M,y);y+=2;doc.addImage(cv.toDataURL("image/png"),"PNG",M,y,60,30)}
  return doc;
}

// ===== Validación =====
function validar(){
  const falta=[];
  if(!$("#cli").value.trim())falta.push("establecimiento");
  if(!$("#ope").value.trim())falta.push("operario");
  CHECK.forEach(s=>s.p.forEach(pt=>{
    if(!R[pt.id].r)falta.push(pt.x);
  }));
  return falta;
}
const msg=(t,c)=>{$("#msg").textContent=t;$("#msg").className=c||""};

$("#bajar").onclick=()=>{crearPDF().save("revision-prueba.pdf")};

$("#enviar").onclick=async()=>{
  const f=validar();
  if(f.length){msg("Falta: "+f.slice(0,4).join(", ")+(f.length>4?` y ${f.length-4} más`:""),"err");return}
  if(!SCRIPT_URL){msg("Configura SCRIPT_URL en el código.","err");return}
  msg("Enviando…");$("#enviar").disabled=true;
  try{
    const pdf=crearPDF().output("datauristring").split(",")[1];
    const r=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({
      cliente:$("#cli").value,equipo:$("#eq").value,operario:$("#ope").value,
      emailCliente:$("#mail").value,fecha:new Date().toISOString(),pdf})});
    const j=await r.json();
    if(j.ok)msg("Enviado correctamente.","good");else throw new Error(j.error);
  }catch(e){msg("No se pudo enviar: "+e.message+". Reintenta con cobertura.","err")}
  $("#enviar").disabled=false;
};
</script>
</body>
</html>
